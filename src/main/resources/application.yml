spring:
  flyway:
    # Analytics owns the only DataSource; migrations run with the admin
    # (object-owner) account. The read-only role is created password-less by
    # V1; AnalyticsRoleCredentials binds its runtime credential via JDBC
    # parameter at startup — no password placeholder exists in migration SQL.
    enabled: ${smartpark.analytics.enabled:false}
    url: ${SMARTPARK_ANALYTICS_DB_URL:}
    user: ${SMARTPARK_ANALYTICS_DB_ADMIN_USER:}
    password: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:}
  autoconfigure:
    # 2.0.0-M1.1 packaging defect: the DashScope autoconfigure jar lists this class in
    # AutoConfiguration.imports but does not ship it. Excluded until the next release.
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
  ai:
    dashscope:
      enabled: ${SPRING_AI_DASHSCOPE_ENABLED:true}
      base-url: ${SPRING_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        completions-path: ${SPRING_AI_DASHSCOPE_CHAT_COMPLETIONS_PATH:/api/v1/services/aigc/text-generation/generation}
        options:
          model: ${SPRING_AI_DASHSCOPE_CHAT_OPTIONS_MODEL:qwen3.7-flash}
      audio:
        transcription:
          options:
            model: ${SPRING_AI_DASHSCOPE_AUDIO_TRANSCRIPTION_OPTIONS_MODEL:paraformer-realtime-v2}
            format: pcm
            sample-rate: 16000
        speech:
          options:
            model: ${SPRING_AI_DASHSCOPE_AUDIO_SPEECH_OPTIONS_MODEL:cosyvoice-v2}
            voice: ${SPRING_AI_DASHSCOPE_AUDIO_SPEECH_OPTIONS_VOICE:longxiaochun_v2}
    mcp:
      server:
        enabled: ${smartpark.mcp.enabled}
        protocol: STATELESS
        type: SYNC
        name: smart-park-readonly
        version: 0.1.0
        instructions: >-
          Mock smart-park read-only queries only. No identity data, knowledge body,
          workflow mutation, or device control.
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
smartpark:
  local-demo:
    enabled: ${SMARTPARK_LOCAL_DEMO_ENABLED:false}
  analytics:
    enabled: ${SMARTPARK_ANALYTICS_ENABLED:false}
    # Re-anchors the time-windowed V1 demo fixtures (energy, alerts, device
    # snapshots, parking) on persistent demo databases. Keep off for real data.
    demo-data-refresh-enabled: ${SMARTPARK_ANALYTICS_DEMO_DATA_REFRESH_ENABLED:false}
    statement-timeout: 3s
    analysis-timeout: 60s
    max-rows: 500
    max-result-bytes: 1048576
    max-plan-cost: 1000000
    time-intent:
      enabled: ${SMARTPARK_ANALYTICS_TIME_INTENT_ENABLED:true}
      url: ${SMARTPARK_ANALYTICS_TIME_INTENT_URL:http://analytics-time-parser:8081}
      connect-timeout: ${SMARTPARK_ANALYTICS_TIME_INTENT_CONNECT_TIMEOUT:1s}
      read-timeout: ${SMARTPARK_ANALYTICS_TIME_INTENT_READ_TIMEOUT:3s}
      max-response-bytes: ${SMARTPARK_ANALYTICS_TIME_INTENT_MAX_RESPONSE_BYTES:32768}
      expected-provider: ${SMARTPARK_ANALYTICS_TIME_INTENT_EXPECTED_PROVIDER:jionlp}
      expected-version: ${SMARTPARK_ANALYTICS_TIME_INTENT_EXPECTED_VERSION:1.5.29}
      timezone: ${SMARTPARK_ANALYTICS_TIME_INTENT_TIMEZONE:Asia/Shanghai}
    datasource:
      url: ${SMARTPARK_ANALYTICS_DB_URL:}
      username: ${SMARTPARK_ANALYTICS_DB_USER:}
      # The runtime connects through the read-only role, so its password must
      # resolve to the same credential Flyway used when creating that role.
      password: ${SMARTPARK_ANALYTICS_DB_RO_PASSWORD:${SMARTPARK_ANALYTICS_DB_PASSWORD:}}
      admin-username: ${SMARTPARK_ANALYTICS_DB_ADMIN_USER:}
      admin-password: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:}
  collaboration:
    expert-timeout: ${SMARTPARK_EXPERT_TIMEOUT:15s}
    run-timeout: ${SMARTPARK_EXPERT_RUN_TIMEOUT:40s}
    max-parallel: ${SMARTPARK_EXPERT_MAX_PARALLEL:3}
  customer:
    minimum-knowledge-score: ${SMARTPARK_CUSTOMER_MINIMUM_KNOWLEDGE_SCORE:0.70}
  showcase:
    preflight-timeout: ${SMARTPARK_SHOWCASE_PREFLIGHT_TIMEOUT:90s}
  mcp:
    enabled: ${SMARTPARK_MCP_ENABLED:false}
  voice:
    # Opt-in: real DashScope ASR/TTS credentials are mandatory when enabled;
    # enabling without AI_DASHSCOPE_API_KEY fails application startup loudly.
    enabled: ${SMARTPARK_VOICE_ENABLED:false}
    allowed-origins: ${SMARTPARK_VOICE_ALLOWED_ORIGINS:http://localhost:5173}
    max-binary-frame-bytes: ${SMARTPARK_VOICE_MAX_BINARY_FRAME_BYTES:65536}
    budgets:
      # 唯一接受的采集规格为 16 kHz / mono / int16（32 字节每毫秒）。
      max-input-duration: ${SMARTPARK_VOICE_MAX_INPUT_DURATION:10s}
      max-agent-duration: ${SMARTPARK_VOICE_MAX_AGENT_DURATION:15s}
      tts-first-chunk-timeout: ${SMARTPARK_VOICE_TTS_FIRST_CHUNK_TIMEOUT:5s}
