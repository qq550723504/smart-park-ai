spring:
  autoconfigure:
    # 2.0.0-M1.1 packaging defect: the DashScope autoconfigure jar lists this class in
    # AutoConfiguration.imports but does not ship it. Excluded until the next release.
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
  ai:
    dashscope:
      enabled: ${SPRING_AI_DASHSCOPE_ENABLED:true}
      base-url: ${SPRING_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    mcp:
      server:
        enabled: ${smartpark.mcp.enabled}
        protocol: STATELESS
        type: SYNC
        name: smart-park-readonly
        version: 0.1.0
        instructions: >-
          Mock smart-park read-only queries only. No identity data, knowledge body,
          workflow mutation, or device control.
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
smartpark:
  analytics:
    enabled: ${SMARTPARK_ANALYTICS_ENABLED:false}
    statement-timeout: 3s
    max-rows: 500
    max-result-bytes: 1048576
    max-plan-cost: 1000000
    datasource:
      url: ${SMARTPARK_ANALYTICS_DB_URL:}
      username: ${SMARTPARK_ANALYTICS_DB_USER:}
      password: ${SMARTPARK_ANALYTICS_DB_PASSWORD:}
      admin-username: ${SMARTPARK_ANALYTICS_DB_ADMIN_USER:}
      admin-password: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:}
  customer:
    minimum-knowledge-score: ${SMARTPARK_CUSTOMER_MINIMUM_KNOWLEDGE_SCORE:0.70}
  mcp:
    enabled: ${SMARTPARK_MCP_ENABLED:false}
