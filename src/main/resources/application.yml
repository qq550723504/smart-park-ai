spring:
  flyway:
    # Analytics owns the only DataSource; migrations run with the admin
    # (object-owner) account and supply the read-only role password placeholder.
    enabled: ${smartpark.analytics.enabled:false}
    url: ${SMARTPARK_ANALYTICS_DB_URL:}
    user: ${SMARTPARK_ANALYTICS_DB_ADMIN_USER:}
    password: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:}
    placeholders:
      analyticsRoPassword: ${SMARTPARK_ANALYTICS_DB_RO_PASSWORD:${SMARTPARK_ANALYTICS_DB_PASSWORD:}}
  autoconfigure:
    # 2.0.0-M1.1 packaging defect: the DashScope autoconfigure jar lists this class in
    # AutoConfiguration.imports but does not ship it. Excluded until the next release.
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
  ai:
    dashscope:
      enabled: ${SPRING_AI_DASHSCOPE_ENABLED:true}
      base-url: ${SPRING_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    mcp:
      server:
        enabled: ${smartpark.mcp.enabled}
        protocol: STATELESS
        type: SYNC
        name: smart-park-readonly
        version: 0.1.0
        instructions: >-
          Mock smart-park read-only queries only. No identity data, knowledge body,
          workflow mutation, or device control.
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
smartpark:
  analytics:
    enabled: ${SMARTPARK_ANALYTICS_ENABLED:false}
    # Mutates timestamps of the seven V1 demo device fixtures only. Keep off
    # for real datasets; enable explicitly only for a persistent demo database.
    demo-snapshot-refresh-enabled: ${SMARTPARK_ANALYTICS_DEMO_SNAPSHOT_REFRESH_ENABLED:false}
    statement-timeout: 3s
    analysis-timeout: 60s
    max-rows: 500
    max-result-bytes: 1048576
    max-plan-cost: 1000000
    datasource:
      url: ${SMARTPARK_ANALYTICS_DB_URL:}
      username: ${SMARTPARK_ANALYTICS_DB_USER:}
      # The runtime connects through the read-only role, so its password must
      # resolve to the same credential Flyway used when creating that role.
      password: ${SMARTPARK_ANALYTICS_DB_RO_PASSWORD:${SMARTPARK_ANALYTICS_DB_PASSWORD:}}
      admin-username: ${SMARTPARK_ANALYTICS_DB_ADMIN_USER:}
      admin-password: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:}
  collaboration:
    expert-timeout: ${SMARTPARK_EXPERT_TIMEOUT:15s}
    run-timeout: ${SMARTPARK_EXPERT_RUN_TIMEOUT:40s}
    max-parallel: ${SMARTPARK_EXPERT_MAX_PARALLEL:3}
  customer:
    minimum-knowledge-score: ${SMARTPARK_CUSTOMER_MINIMUM_KNOWLEDGE_SCORE:0.70}
  mcp:
    enabled: ${SMARTPARK_MCP_ENABLED:false}
