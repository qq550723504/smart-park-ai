spring:
  ai:
    dashscope:
      enabled: ${SPRING_AI_DASHSCOPE_ENABLED:true}
      base-url: ${SPRING_AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus

smartpark:
  knowledge:
    mode: ${SMARTPARK_KNOWLEDGE_MODE:mock}
    min-similarity-score: ${SMARTPARK_KNOWLEDGE_MIN_SIMILARITY_SCORE:0.65}
  customer-service:
    answer-mode: ${SMARTPARK_CUSTOMER_SERVICE_ANSWER_MODE:mock}
