name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test
      - name: Smoke hardened time-parser container
        run: |
          image=analytics-time-parser-ci:${{ github.sha }}
          docker build --tag "$image" ./time-parser
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --entrypoint python \
            "$image" \
            -c 'import app, os; health = app.health(); assert os.getuid() != 0, os.getuid(); assert health.status == "UP", health; assert health.provider == "jionlp", health; assert health.version == "1.5.29", health'
      - name: Test showcase verifier
        run: pwsh -NoProfile -File ./scripts/verify-showcase.tests.ps1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit
      - name: Verify responsive layout in headless Chrome
        run: node scripts/verify-layout.mjs
      - name: Build frontend
        run: npm run build
