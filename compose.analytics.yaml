services:
  analytics-postgres:
    environment:
      # Override the local demo-only trust value explicitly. Do not rely on a
      # null merge: Compose can retain the inherited mapping value.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:?set SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD in .env before enabling analytics}
    volumes:
      - type: volume
        source: analytics-postgres-analytics-data
        target: /var/lib/postgresql/data

  backend:
    profiles: [analytics]
    environment:
      SPRING_AI_DASHSCOPE_ENABLED: "true"
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:?set AI_DASHSCOPE_API_KEY in .env before enabling analytics}
      SMARTPARK_ANALYTICS_ENABLED: "true"
      SMARTPARK_ANALYTICS_DEMO_DATA_REFRESH_ENABLED: "true"
      SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD: ${SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD:?set SMARTPARK_ANALYTICS_DB_ADMIN_PASSWORD in .env before enabling analytics}
      SMARTPARK_ANALYTICS_DB_RO_PASSWORD: ${SMARTPARK_ANALYTICS_DB_RO_PASSWORD:?set SMARTPARK_ANALYTICS_DB_RO_PASSWORD in .env before enabling analytics}
      SMARTPARK_ANALYTICS_DB_USER: smartpark_analytics_ro

volumes:
  analytics-postgres-analytics-data:
